name: continuous Windows build

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: continuous-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run verify
      - name: Upload test diagnostics
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: MILF-Viewer-test-diagnostics-${{ github.sha }}
          path: output/playwright
          if-no-files-found: ignore
          retention-days: 14
      - name: Prepare continuous release payload
        shell: pwsh
        run: |
          $packageVersion = (Get-Content package.json -Raw | ConvertFrom-Json).version
          $source = "dist/MILF-Viewer-$packageVersion.exe"
          $executable = "dist/MILF-Viewer-latest.exe"
          if (-not (Test-Path -LiteralPath $source -PathType Leaf)) {
            throw "Expected continuous executable '$source' was not produced."
          }

          Move-Item -LiteralPath $source -Destination $executable
          $hash = (Get-FileHash -LiteralPath $executable -Algorithm SHA256).Hash.ToLowerInvariant()
          $fileName = Split-Path -Leaf $executable
          Set-Content -LiteralPath "$executable.sha256" -Value "$hash *$fileName" -Encoding ascii -NoNewline
      - name: Upload continuous release payload
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: MILF-Viewer-continuous-${{ github.sha }}
          path: |
            dist/MILF-Viewer-latest.exe
            dist/MILF-Viewer-latest.exe.sha256
          if-no-files-found: error
          retention-days: 14
          compression-level: 0

  attest-continuous:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      id-token: write
      attestations: write
      artifact-metadata: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: MILF-Viewer-continuous-${{ github.sha }}
          path: dist
      - name: Attest build provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-path: dist/MILF-Viewer-latest.exe

  publish-continuous:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [build, attest-continuous]
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: MILF-Viewer-continuous-${{ github.sha }}
          path: dist
      - name: Update continuous prerelease
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          retry() {
            local description="$1"
            shift
            local attempt=1
            local max_attempts=6
            local delay=5

            until "$@"; do
              if (( attempt >= max_attempts )); then
                echo "::error::$description failed after $attempt attempts" >&2
                return 1
              fi

              echo "::warning::$description failed on attempt $attempt; retrying in ${delay}s" >&2
              sleep "$delay"
              attempt=$((attempt + 1))
              delay=$((delay < 30 ? delay * 2 : 30))
            done
          }

          if ! gh api "repos/$GITHUB_REPOSITORY/git/refs/tags/continuous" \
            --method PATCH --field sha="$GITHUB_SHA" --field force=true >/dev/null 2>&1; then
            gh api "repos/$GITHUB_REPOSITORY/git/refs" \
              --method POST --field ref="refs/tags/continuous" --field sha="$GITHUB_SHA" >/dev/null
          fi

          asset_sha256="$(cut -d' ' -f1 dist/MILF-Viewer-latest.exe.sha256)"
          notes="Automatically rebuilt from main commit $GITHUB_SHA. SHA-256: $asset_sha256"
          if gh release view continuous >/dev/null 2>&1; then
            retry "Edit continuous release" gh release edit continuous \
              --title "MILF Viewer continuous build" --notes "$notes" --prerelease
          else
            retry "Create continuous release" gh release create continuous --verify-tag --latest=false \
              --title "MILF Viewer continuous build" --notes "$notes" --prerelease
          fi

          retry "Upload continuous release assets" gh release upload continuous \
            dist/MILF-Viewer-latest.exe \
            dist/MILF-Viewer-latest.exe.sha256 \
            --clobber
