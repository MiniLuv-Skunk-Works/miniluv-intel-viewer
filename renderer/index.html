<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<!-- default-src 'none' blocks every outbound load, so a compromised server
     cannot pull in or exfiltrate to another host. script-src 'self' is the
     important one: no inline script runs, so injected markup is inert.
     style-src still permits inline because the layout uses style attributes;
     CSS injection is a far smaller problem and default-src 'none' already
     stops it reaching the network. -->
<meta http-equiv="Content-Security-Policy"
      content="default-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline';
               img-src 'self' data:; connect-src 'none';">
<title>M.I.L.F Viewer</title>
<style>
  /* Sits over a game, so: dark, high contrast, no wasted vertical space.
     Nothing here should need a second look to read. */
  /* Three background alphas rather than one guess - how transparent is
     comfortable depends entirely on what's behind it. Only the BACKGROUND
     fades; text stays fully opaque, which is why this is CSS rather than
     Electron's setOpacity(). */
  :root {
    --bg: rgba(16,17,19,.80);
    --line: #2b2d31;
    --text: #e8e9ea;
    --dim: #8b8e93;
    --blue: #4a9eff;
    --green: #42b72a;
    --amber: #e8a33d;
    --red: #fa383e;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; overflow: hidden; }
  body.op0 { --bg: rgba(16,17,19,.94); }   /* solid   - reading a fit */
  body.op1 { --bg: rgba(16,17,19,.72); }   /* default - over the game */
  body.op2 { --bg: rgba(16,17,19,.44); }   /* faint   - barely there */
  body {
    font: 13px/1.4 "Segoe UI", Helvetica, Arial, sans-serif;
    color: var(--text); background: var(--bg);
    border: 1px solid var(--line); border-radius: 8px;
    display: flex; flex-direction: column;
    user-select: none;
  }

  header {
    -webkit-app-region: drag;          /* the whole bar is the grab handle */
    display: flex; align-items: center; gap: 8px;
    padding: 7px 8px 7px 11px;
    border-bottom: 1px solid var(--line);
    background: rgba(0,0,0,.18);
  }
  .brand { font-weight: 800; letter-spacing: .5px; font-size: 12px; }
  .brand small { color: var(--dim); font-weight: 600; letter-spacing: 0; }
  .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--dim); flex: 0 0 auto; }
  .dot.live { background: var(--green); }
  .dot.warn { background: var(--amber); }
  .dot.bad  { background: var(--red); }
  .spacer { flex: 1; }
  header button {
    -webkit-app-region: no-drag;
    background: transparent; border: 1px solid var(--line); color: var(--dim);
    border-radius: 4px; font-size: 11px; padding: 3px 7px; cursor: pointer;
  }
  header button:hover { color: var(--text); border-color: var(--dim); }
  header button.on { color: #fff; background: var(--blue); border-color: var(--blue); }
  header button.armed { color: #fff; background: var(--green); border-color: var(--green); }

  #status { font-size: 11px; color: var(--dim); padding: 4px 11px; border-bottom: 1px solid var(--line); }
  #status.hidden { display: none; }

  main { flex: 1; overflow-y: auto; overflow-x: hidden; }
  main::-webkit-scrollbar { width: 8px; }
  main::-webkit-scrollbar-thumb { background: #34363a; border-radius: 4px; }

  .scan { padding: 8px 11px; border-bottom: 1px solid var(--line); }
  .scan:first-child { background: rgba(74,158,255,.07); }
  .row1 { display: flex; align-items: baseline; gap: 6px; }
  .hull { font-weight: 700; font-size: 14px; }
  .sys { color: var(--blue); font-weight: 600; }
  /* Truncates rather than pushing the age and BUMP button off the row. The
     window can be dragged down to 280px and that button has to stay reachable. */
  .pilot { color: var(--blue); font-weight: 600;
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-width: 0; }
  .hull { flex: 0 0 auto; }
  .row1 .age { flex: 0 0 auto; }
  .row1 .bumpbtn { flex: 0 0 auto; }
  .age { margin-left: auto; color: var(--dim); font-size: 11px; font-variant-numeric: tabular-nums; }
  .age.stale { color: var(--amber); }
  .age.dead { color: var(--red); }
  .row2 { display: flex; gap: 10px; margin-top: 3px; font-size: 12px; flex-wrap: wrap; }
  .val { font-weight: 700; }
  .val.t1 { color: var(--dim); }
  .val.t2 { color: var(--green); }
  .val.t3 { color: var(--amber); }
  .val.t4 { color: var(--red); }
  .ehp { color: var(--dim); }
  .fleet { margin-top: 4px; font-size: 11px; color: var(--dim);
           font-family: Consolas, monospace; }
  .fleet b { color: var(--text); font-weight: 700; }
  .meta { margin-top: 3px; font-size: 11px; color: var(--dim); }
  .notes { margin-top: 3px; font-size: 11px; color: var(--amber); }

  .empty { padding: 22px 14px; text-align: center; color: var(--dim); font-size: 12px; }

  /* pairing */
  /* detail popup */
  #detail { position: absolute; inset: 0; background: var(--bg);
            display: none; flex-direction: column; z-index: 20; }
  #detail.show { display: flex; }
  #detail header { -webkit-app-region: no-drag; }
  #detail .body { flex: 1; overflow-y: auto; padding: 10px 12px; }
  #detail h3 { margin: 12px 0 5px; font-size: 11px; text-transform: uppercase;
               letter-spacing: .6px; color: var(--dim); }
  #detail h3:first-child { margin-top: 0; }
  #detail pre { margin: 0; font: 11px/1.45 Consolas, monospace; white-space: pre-wrap;
                word-break: break-word; background: #17181a; border: 1px solid var(--line);
                border-radius: 5px; padding: 8px; }
  #detail .kv { font-size: 12px; margin: 2px 0; }
  #detail .kv b { color: var(--dim); font-weight: 600; display: inline-block; min-width: 66px; }
  .scan { cursor: pointer; }
  /* bump timer - the whole point is being readable at a glance mid-fight */
  .bumpbtn { margin-left:auto; font-size:10px; font-weight:800; letter-spacing:.4px;
    padding:2px 7px; border-radius:4px; border:1px solid var(--line);
    background:transparent; color:var(--dim); cursor:pointer; }
  .bumpbtn:hover { color:#fff; border-color:var(--blue); background:var(--blue); }
  .bumprow { display:flex; align-items:center; gap:7px; margin-top:5px;
    font-size:11px; font-weight:700; }
  .bumpbar { flex:1; height:4px; border-radius:2px; background:#2b2d31; overflow:hidden; }
  .bumpbar i { display:block; height:100%; background:var(--green); transition:width .5s linear; }
  .bumprow.warn .bumpbar i { background:var(--amber); }
  .bumprow.gone .bumpbar i { background:var(--red); }
  .bumpleft { font-variant-numeric:tabular-nums; color:var(--green); min-width:38px; }
  .bumprow.warn .bumpleft { color:var(--amber); }
  .bumprow.gone .bumpleft { color:var(--red); }
  .bumpwho { color:var(--dim); font-weight:600; }
  .scan:hover { background: rgba(255,255,255,.045); }

  /* click-through hint - the window ignores clicks, so this has to say how to get out */
  #pair { padding: 14px; display: none; }
  #pair.show { display: block; }
  #pair h2 { margin: 0 0 4px; font-size: 14px; }
  #pair p { margin: 0 0 10px; font-size: 11px; color: var(--dim); line-height: 1.5; }
  #pair label { display: block; font-size: 11px; color: var(--dim); margin: 8px 0 3px; }
  #pair input {
    width: 100%; padding: 7px 8px; font-size: 13px;
    background: #202226; border: 1px solid var(--line); border-radius: 4px; color: var(--text);
  }
  #pair input#code { font-family: Consolas, monospace; letter-spacing: 2px; text-transform: uppercase; }
  #pair button {
    -webkit-app-region: no-drag;
    width: 100%; margin-top: 11px; padding: 8px; font-size: 13px; font-weight: 700;
    background: var(--blue); color: #fff; border: 0; border-radius: 4px; cursor: pointer;
  }
  #pair button:disabled { opacity: .55; cursor: wait; }
  #pairErr { margin-top: 8px; font-size: 11px; color: var(--red); }
</style>
</head>
<body>

<header>
  <div class="dot" id="dot"></div>
  <div class="brand">M.I.L.F <small>viewer</small></div>
  <div class="spacer"></div>
  <button id="clipBtn" title="Watch the clipboard and send EVE scans to the dashboard">clip</button>
  <button id="clearBtn" title="Clear the feed">clear</button>
  <button id="opBtn" title="Cycle window transparency">opacity</button>
  <button id="repairBtn" title="Forget this pairing and enter a new code">re-pair</button>
  <button id="quitBtn" title="Quit">&times;</button>
</header>

<div id="status" class="hidden"></div>

<main id="list">
  <div class="empty" id="empty">Waiting for scans&hellip;</div>
</main>

<div id="detail">
  <header>
    <div class="brand" id="detailTitle">&mdash;</div>
    <div class="spacer"></div>
    <button id="detailClose">back</button>
  </header>
  <div class="body" id="detailBody"></div>
</div>

<div id="pair">
  <h2>Pair this viewer</h2>
  <p>In the dashboard, open <b>Pair viewer</b> and enter the code it shows.
     The code is single-use and expires in five minutes.</p>
  <label for="server">Dashboard address</label>
  <input id="server" placeholder="https://dunk.example.com" spellcheck="false">
  <label for="code">Pairing code</label>
  <input id="code" placeholder="ABCD-EFGH" maxlength="9" spellcheck="false">
  <button id="pairBtn">Pair</button>
  <div id="pairErr"></div>
  <div style="margin-top:10px;text-align:center">
    <a href="#" id="pairCancel" style="font-size:11px;color:var(--dim)">back to the feed</a>
  </div>
</div>

<script src="../.build/renderer/app.js"></script>
</body>
</html>
