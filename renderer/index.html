<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<!-- The renderer cannot load remote content. Inline style remains enabled only
     for the locally calculated bump progress width; server data is text only. -->
<meta http-equiv="Content-Security-Policy"
      content="default-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline';
               img-src 'self' data:; connect-src 'none';">
<title>M.I.L.F Viewer</title>
<style>
  :root {
    --bg: rgba(16,17,19,.88);
    --line: #5d626b;
    --text: #f4f5f6;
    --dim: #c7cad0;
    --blue: #85c1ff;
    --green: #8ee078;
    --amber: #ffc36b;
    --red: #ffa1a6;
    --blue-fill: #1e65a8;
    --green-fill: #287c1b;
    --control-border: #a5abb4;
    --focus: #ffffff;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; overflow: hidden; }
  body.op0 { --bg: rgba(16,17,19,.98); }
  body.op1 { --bg: rgba(16,17,19,.87); }
  body.op2 { --bg: rgba(16,17,19,.76); }
  body {
    position: relative;
    font: 13px/1.4 "Segoe UI", Helvetica, Arial, sans-serif;
    color: var(--text); background: var(--bg);
    border: 1px solid var(--line); border-radius: 8px;
    user-select: none;
  }
  #viewerShell { height: 100%; min-height: 0; display: flex; flex-direction: column; }
  header {
    -webkit-app-region: drag;
    display: flex; align-items: center; gap: 8px;
    padding: 7px 8px 7px 11px;
    border-bottom: 1px solid var(--line);
    background: rgba(0,0,0,.28);
  }
  .brand { font-weight: 800; letter-spacing: .5px; font-size: 12px; }
  .brand small { color: var(--dim); font-weight: 600; letter-spacing: 0; }
  .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--dim); flex: 0 0 auto; }
  .dot.live { background: var(--green); }
  .dot.warn { background: var(--amber); }
  .dot.bad { background: var(--red); }
  .spacer { flex: 1; }
  button, input { font: inherit; }
  header button {
    -webkit-app-region: no-drag;
    background: rgba(0,0,0,.32); border: 1px solid var(--control-border); color: var(--text);
    border-radius: 4px; font-size: 11px; padding: 3px 7px; cursor: pointer;
  }
  header button:hover { color: #fff; background: var(--blue-fill); }
  header button.armed { color: #fff; background: var(--green-fill); border-color: var(--control-border); }
  button:focus-visible, input:focus-visible, [role="button"]:focus-visible, [tabindex]:focus-visible {
    outline: 3px solid var(--focus);
    outline-offset: 2px;
  }

  #status { font-size: 11px; color: var(--text); padding: 4px 11px; border-bottom: 1px solid var(--line); }
  #status.status-visually-hidden {
    position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px;
    overflow: hidden; clip: rect(0,0,0,0); white-space: nowrap; border: 0;
  }

  main { flex: 1; min-height: 0; overflow-y: auto; overflow-x: hidden; }
  main:focus { outline: none; }
  main::-webkit-scrollbar { width: 8px; }
  main::-webkit-scrollbar-thumb { background: #737983; border-radius: 4px; }
  .scan { position: relative; border-bottom: 1px solid var(--line); }
  .scan:first-child .scanOpen { background: rgba(30,101,168,.28); }
  .scanOpen { padding: 8px 11px; cursor: pointer; }
  .scanOpen:hover { background: rgba(255,255,255,.10); }
  .scanOpen:focus-visible { outline-offset: -3px; background: rgba(30,101,168,.42); }
  .row1 { display: flex; align-items: baseline; gap: 6px; padding-right: 58px; }
  .hull { font-weight: 700; font-size: 14px; flex: 0 0 auto; }
  .pilot {
    color: var(--blue); font-weight: 600; overflow: hidden;
    text-overflow: ellipsis; white-space: nowrap; min-width: 0;
  }
  .age { margin-left: auto; color: var(--dim); font-size: 11px; font-variant-numeric: tabular-nums; flex: 0 0 auto; }
  .age.stale { color: var(--amber); }
  .age.dead { color: var(--red); }
  .row2 { display: flex; gap: 10px; margin-top: 3px; font-size: 12px; flex-wrap: wrap; }
  .val { font-weight: 700; }
  .val.t1 { color: var(--dim); }
  .val.t2 { color: var(--green); }
  .val.t3 { color: var(--amber); }
  .val.t4 { color: var(--red); }
  .ehp { color: var(--dim); }
  .fleet { margin-top: 4px; font-size: 11px; color: var(--dim); font-family: Consolas, monospace; }
  .fleet b { color: var(--text); font-weight: 700; }
  .meta { margin-top: 3px; font-size: 11px; color: var(--dim); }
  .notes { margin-top: 3px; font-size: 11px; color: var(--amber); }
  .empty { padding: 22px 14px; text-align: center; color: var(--dim); font-size: 12px; }

  .bumpbtn {
    position: absolute; top: 8px; right: 11px;
    font-size: 10px; font-weight: 800; letter-spacing: .4px;
    padding: 2px 7px; border-radius: 4px; border: 1px solid var(--control-border);
    background: rgba(0,0,0,.32); color: var(--text); cursor: pointer;
  }
  .bumpbtn:hover { color: #fff; border-color: var(--control-border); background: var(--blue-fill); }
  .bumpbtn:disabled { opacity: .72; cursor: wait; }
  .bumprow { display: flex; align-items: center; gap: 7px; margin-top: 5px; font-size: 11px; font-weight: 700; }
  .bumprow[hidden] { display: none; }
  .bumpbar { flex: 1; height: 4px; border-radius: 2px; background: #5d626b; overflow: hidden; }
  .bumpbar i { display: block; height: 100%; width: 100%; background: var(--green); transition: width .5s linear; }
  .bumprow.warn .bumpbar i { background: var(--amber); }
  .bumprow.gone .bumpbar i { background: var(--red); }
  .bumpleft { font-variant-numeric: tabular-nums; color: var(--green); min-width: 38px; }
  .bumprow.warn .bumpleft { color: var(--amber); }
  .bumprow.gone .bumpleft { color: var(--red); }
  .bumpwho { color: var(--dim); font-weight: 600; }

  #detail, #pair {
    position: absolute; inset: 0; background: var(--bg);
    display: none; flex-direction: column; z-index: 20;
  }
  #detail.show, #pair.show { display: flex; }
  #detail header { -webkit-app-region: no-drag; }
  #detail .body { flex: 1; overflow-y: auto; padding: 10px 12px; user-select: text; }
  #detail .body:focus-visible { outline-offset: -3px; }
  #detail h3 { margin: 12px 0 5px; font-size: 11px; text-transform: uppercase;
               letter-spacing: .6px; color: var(--dim); }
  #detail h3:first-child { margin-top: 0; }
  #detail pre {
    margin: 0; font: 11px/1.45 Consolas, monospace; white-space: pre-wrap;
    word-break: break-word; background: #17181a; border: 1px solid var(--control-border);
    border-radius: 5px; padding: 8px; color: var(--text);
  }
  #detail .kv { font-size: 12px; margin: 2px 0; }
  #detail .kv b { color: var(--dim); font-weight: 600; display: inline-block; min-width: 66px; }
  #detail .missing { color: var(--dim); }

  #pair { z-index: 30; overflow-y: auto; padding: 14px; }
  #pairForm { margin: auto 0; }
  #pair h2 { margin: 0 0 4px; font-size: 14px; }
  #pair p { margin: 0 0 10px; font-size: 11px; color: var(--dim); line-height: 1.5; }
  #pair label { display: block; font-size: 11px; color: var(--dim); margin: 8px 0 3px; }
  #pair input {
    width: 100%; padding: 7px 8px; font-size: 13px;
    background: #202226; border: 1px solid var(--control-border); border-radius: 4px; color: var(--text);
  }
  #pair input::placeholder { color: #b8bdc5; }
  #pair input#code { font-family: Consolas, monospace; letter-spacing: 2px; text-transform: uppercase; }
  #pair .primary {
    width: 100%; margin-top: 11px; padding: 8px; font-size: 13px; font-weight: 700;
    background: var(--blue-fill); color: #fff; border: 1px solid var(--control-border);
    border-radius: 4px; cursor: pointer;
  }
  #pair .primary:disabled { opacity: .72; cursor: wait; }
  #pairErr { min-height: 16px; margin-top: 8px; font-size: 11px; color: var(--red); }
  #pairCancel {
    display: block; margin: 10px auto 0; padding: 4px 8px;
    color: var(--text); background: rgba(0,0,0,.32);
    border: 1px solid var(--control-border); border-radius: 4px; cursor: pointer;
  }
  #pairCancel[hidden] { display: none; }
</style>
</head>
<body class="op1">
<div id="viewerShell">
  <header id="appHeader">
    <div class="dot" id="dot" aria-hidden="true"></div>
    <div class="brand">M.I.L.F <small>viewer</small></div>
    <div class="spacer"></div>
    <button type="button" id="clipBtn" aria-pressed="false" aria-label="Enable clipboard scan watching"
            title="Watch the clipboard and send EVE scans to the dashboard">clip</button>
    <button type="button" id="clearBtn" aria-label="Clear the scan feed" title="Clear the feed">clear</button>
    <button type="button" id="opBtn" aria-label="Window transparency: default. Change to faint"
            title="Cycle window transparency">default</button>
    <button type="button" id="repairBtn" aria-label="Forget this pairing and enter a new code"
            title="Forget this pairing and enter a new code">re-pair</button>
    <button type="button" id="quitBtn" aria-label="Quit MILF Viewer" title="Quit">&times;</button>
  </header>
  <div id="status" class="status-visually-hidden" role="status" aria-live="polite" aria-atomic="true">Connected</div>
  <main id="list" tabindex="-1" aria-label="Live scan feed">
    <div class="empty">Waiting for scans&hellip;</div>
  </main>
</div>

<section id="detail" role="dialog" aria-modal="true" aria-labelledby="detailTitle" aria-hidden="true">
  <header>
    <div class="brand" id="detailTitle">&mdash;</div>
    <div class="spacer"></div>
    <button type="button" id="detailClose" aria-label="Close scan details">back</button>
  </header>
  <div class="body" id="detailBody" tabindex="0"></div>
</section>

<section id="pair" role="dialog" aria-modal="true" aria-labelledby="pairTitle" aria-hidden="true">
  <form id="pairForm">
    <h2 id="pairTitle">Pair this viewer</h2>
    <p>In the dashboard, open <b>Pair viewer</b> and enter the code it shows.
       The code is single-use and expires in five minutes.</p>
    <label for="server">Dashboard address</label>
    <input id="server" placeholder="https://dunk.example.com" spellcheck="false" autocomplete="url">
    <label for="code">Pairing code</label>
    <input id="code" placeholder="ABCD-EFGH" maxlength="9" spellcheck="false" autocomplete="one-time-code">
    <button class="primary" type="submit" id="pairBtn">Pair</button>
    <div id="pairErr" role="alert" aria-live="assertive"></div>
    <button type="button" id="pairCancel" hidden>back to the feed</button>
  </form>
</section>

<script src="../.build/renderer/app.js"></script>
</body>
</html>
